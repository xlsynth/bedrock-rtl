title = "Bedrock-RTL gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "token"
description = "look for 'TOKEN' string"
regex = '''TOKEN'''

[[rules.allowlists]]
description = "Let the CI workflow pass GitHub's temporary job token to the GitHub CLI."
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
regexTarget = "line"
regexes = ['''(?m)^ +GH_TOKEN: \$\{\{ github\.token \}\}$''']

[[rules]]
id = "hw1p"
description = "look for 'hw1p' string"
regex = '''hw1p'''

[[rules]]
id = "hw-infra"
description = "look for 'hw-infra' string"
regex = '''hw-infra'''
keywords = ["hw-infra"]

[[rules]]
id = "modulefiles"
description = "look for 'modulefiles' string"
regex = '''modulefiles'''

[[rules]]
id = "license"
description = "look for '_LICENSE' string"
regex = '''_LICENSE[_|$]'''

[[rules]]
id = "ssh"
description = "look for 'SSH' string"
regex = '''SSH'''

[[allowlists]]
description = "Ignore this configuration file's own rule patterns, and the already-gitignored client-local user.bazelrc file."
paths = [
    '''^\.gitleaks\.toml$''',
    '''^user.bazelrc$''',
]
