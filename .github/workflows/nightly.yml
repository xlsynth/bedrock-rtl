name: Nightly Tests

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC.
  workflow_dispatch: {}

permissions:
  contents: read

# Run one nightly workflow at a time.
concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: false

jobs:
  bazel-build:
    runs-on: self-hosted
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Copy ci.bazelrc
        run: cp /home/gh-actions/bedrock-infra/ci.bazelrc ci.bazelrc
      - name: Build
        run: |
          bazel build --noshow_loading_progress //... > .bazel-build-nightly.log 2>&1 || {
            code=$?
            echo "::error::Nightly Bazel build failed. See the log on the private runner."
            exit "$code"
          }

  bazel-test-jg:
    runs-on: self-hosted
    needs: bazel-build
    steps:
      # Another job can reuse the workspace between the build and this job.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Copy ci.bazelrc
        run: cp /home/gh-actions/bedrock-infra/ci.bazelrc ci.bazelrc
      - name: Run and summarize JasperGold tests
        shell: bash
        run: |
          printf '## Nightly JasperGold tests\n\n' >> "$GITHUB_STEP_SUMMARY"

          # Sample at most 1,000 targets and keep the existing slow-suite exclusions.
          if ! discovered=$(bazel query --output=label 'tests(//...) intersect attr(tags, "jg", //...)' 2> .bazel-query-jg.log); then
            echo "Test counts are unavailable because the Bazel query failed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::JasperGold test discovery failed. See the query log on the private runner."
            exit 1
          fi
          sample=$(printf '%s\n' "$discovered" | awk 'NF && !/^\/\/(fifo|cdc)\/fpv:/' | shuf -n 1000)
          if [[ -z "$sample" ]]; then
            echo "No eligible JasperGold tests were selected." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No eligible JasperGold tests were selected."
            exit 1
          fi

          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done <<< "$sample"

          # Keep all test output on the private runner. Publish only aggregate counts.
          test_exit=0
          bazel test --noshow_loading_progress --color=no --curses=no \
            --test_output=summary --test_summary=short --test_timeout=60 \
            "${targets[@]}" > .bazel-test-jg.log 2>&1 || test_exit=$?

          if read -r total passed timed_out < <(
            awk '
              /^Executed [0-9]+ out of [0-9]+ tests?:/ {
                total = $5
                passed = 0
                if (match($0, /[0-9]+ tests? pass(es)?([,. ]|$)/)) {
                  passed = substr($0, RSTART, RLENGTH) + 0
                }
              }
              /^\/\/[^[:space:]]+[[:space:]]+(\(([0-9]+\/[0-9]+ )?cached\)[[:space:]]+)?TIMEOUT([[:space:]]|$)/ {
                timed_out++
              }
              END {
                if (total > 0 && passed + timed_out <= total) {
                  print total, passed, timed_out + 0
                }
              }
            ' .bazel-test-jg.log
          ); then
            {
              printf '| Total targets | Passed | Timed out | Other non-passing |\n'
              printf '| ---: | ---: | ---: | ---: |\n'
              printf '| %d | %d | %d | %d |\n' "$total" "$passed" "$timed_out" "$((total - passed - timed_out))"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bazel did not report usable test counts." >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '\nBazel exit code: %d\n' "$test_exit" >> "$GITHUB_STEP_SUMMARY"
          if (( test_exit != 0 )); then
            printf '::error::JasperGold Bazel invocation exited with code %d. See the log on the private runner.\n' "$test_exit"
          fi
          exit "$test_exit"
